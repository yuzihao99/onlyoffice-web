<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>接入页</title>
    <style>
      html, body { height: 100%; width: 100%; margin: 0; overflow: hidden; }
      body { position: relative; font: 14px/1.6 system-ui, sans-serif; }
      #状态 { display: none; }
      .stage,
      .onlyoffice-container {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        max-height: none !important;
        box-sizing: border-box;
      }
      /* DocsAPI 可能写死偏矮的 height；用 !important + 后代选择器压住 */
      .onlyoffice-container iframe,
      .onlyoffice-container > iframe,
      #iframe-office-id,
      iframe[name="frameEditor"] {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
        max-height: none !important;
        box-sizing: border-box !important;
      }
    </style>
  </head>
  <body>
    <div id="状态">等宿主把配置递进来…</div>
    <div class="stage">
      <div class="onlyoffice-container">
        <div id="iframe-office-id" style="position:absolute;inset:0;width:100%;height:100%"></div>
      </div>
    </div>
    <script type="module" src="/src/embed.ts"></script>
  </body>
</html>
